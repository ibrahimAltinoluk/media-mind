<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaMind</title>
  </head>

  <body>
    <div id="root"></div>
    <!-- Eski macOS WebKit'i için: eksik küçük işlevler ve uygulama yüklenemezse boş beyaz sayfa yerine açıklama (ES5) -->
    <script>
      (function () {
        if (!Object.hasOwn) Object.hasOwn = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
        function at(n) { n = Math.trunc(n) || 0; if (n < 0) n += this.length; return n < 0 || n >= this.length ? undefined : this[n]; }
        if (!Array.prototype.at) Object.defineProperty(Array.prototype, "at", { value: at, writable: true, configurable: true });
        if (!String.prototype.at) Object.defineProperty(String.prototype, "at", { value: at, writable: true, configurable: true });
        var errors = [];
        window.addEventListener("error", function (e) { errors.push((e.message || "Hata") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")); });
        setTimeout(function () {
          var r = document.getElementById("root");
          if (r && !r.firstChild) {
            r.innerHTML = '<div style="font:13px -apple-system,sans-serif;padding:40px;color:#555;max-width:560px;margin:auto">' +
              '<h2 style="font-size:17px;color:#222">MediaMind arayüzü yüklenemedi</h2>' +
              '<p>Bu Mac\'in macOS sürümündeki web bileşeni uygulamanın bir parçasını çalıştıramadı. Lütfen bu ekranın görüntüsünü paylaş.</p>' +
              '<pre style="white-space:pre-wrap;background:#f2f2f2;padding:10px;border-radius:6px">' +
              (errors.join("\n") || "Ayrıntı yok") + "\n" + navigator.userAgent + "</pre></div>";
          }
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
