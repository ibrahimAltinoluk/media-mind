[project]
name = "mediamind"
version = "0.1.0"
description = "MediaMind: offline fotoğraf ve video arşivi yöneticisi"
readme = "README.md"
authors = [
    { name = "İbrahim ALTINOLUK", email = "ibrahim.altinoluk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "blake3>=1.0.11",
    "cryptography<=48.0.1; platform_machine == 'x86_64'",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.4.0",
    "imagehash>=4.3.2",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "onnxruntime>=1.31.1; platform_machine != 'x86_64'",
    "onnxruntime<=1.23.2,>=1.19.2; platform_machine == 'x86_64'",
    "openai>=3.46.0",
    "pathspec>=1.1.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pyobjc-framework-imagecapturecore>=13.0",
    "pyobjc-framework-vision>=13.0",
    "reverse-geocoder>=1.5.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.3",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "geonamescache>=3.0.2",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "scikit-image>=0.26.0",
]

[project.scripts]
mediamind = "mediamind.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
